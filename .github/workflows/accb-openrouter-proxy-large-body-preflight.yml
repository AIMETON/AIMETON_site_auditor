name: ACCB OpenRouter Proxy Large-Body No-Paid Preflight
on:
  workflow_dispatch:
    inputs:
      expected_sha: { required: true, type: string }
      evidence_issue: { required: true, default: "820", type: string }
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    environment: stage
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      OPENROUTER_PROXY_URL: ${{ vars.OPENROUTER_PROXY_URL }}
      OPENROUTER_SOCKS_URL: ${{ vars.OPENROUTER_SOCKS_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test staged and exact large-body uploads without model generation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import urllib.parse

          sys.path.insert(0, "scripts")
          import accb_layer_b_dry_run as dry
          import openrouter_proxy_client as client

          receipt = {
              "schema_version": "1.0",
              "status": "OPENROUTER_PROXY_LARGE_BODY_PREFLIGHT_FAILED",
              "model_generation_requests": 0,
              "paid_spend_authorized_rub": 0,
              "authorization_header_sent_to_transport_target": False,
              "transport_target": "httpbin.org/post",
              "proxy_transport": "socks5h",
              "synthetic_payload_only": True,
              "raw_transport_response_retained": False,
              "proxy_value_retained": False,
              "automatic_retries": 0,
          }
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()

          def sanitized_key_state(result):
              data = json.loads(result.body.decode("utf-8"))
              data = data.get("data") if isinstance(data.get("data"), dict) else data
              allowed = ("limit", "limit_remaining", "usage", "usage_daily", "usage_weekly", "usage_monthly")
              return {
                  "http_status": result.http_status,
                  **{name: data.get(name) for name in allowed if isinstance(data.get(name), (int, float))},
              }

          try:
              socks_endpoint = os.environ.get("OPENROUTER_SOCKS_URL", "").strip()
              if socks_endpoint.startswith(("http://", "https://")):
                  parsed = urllib.parse.urlsplit(socks_endpoint)
                  if not parsed.hostname or parsed.username or parsed.password:
                      raise RuntimeError("openrouter_socks_endpoint_invalid")
                  host = f"[{parsed.hostname}]" if ":" in parsed.hostname else parsed.hostname
                  port = parsed.port or 50101
                  proxy = f"socks5h://{host}:{port}"
              else:
                  proxy = socks_endpoint
              client.validate_proxy_and_key(proxy, key)
              key_before_result = client.authenticated_get(
                  url=client.OPENROUTER_KEY_URL,
                  proxy=proxy,
                  api_key=key,
                  total_timeout_seconds=90,
              )
              if key_before_result.http_status != 200:
                  raise RuntimeError(f"openrouter_key_preflight_http_{key_before_result.http_status}")
              receipt["key_before"] = sanitized_key_state(key_before_result)

              snapshot = dry.verify_snapshot()
              scenario = dry._read_json(dry.SCENARIO_PATH)
              seed, _ = dry.derive_assembly_seed(
                  scenario["scenario_id"], scenario["scenario_version"], 32768
              )
              context, manifest = dry.assemble_context(
                  scenario,
                  anchor_tokens=32768,
                  seed=seed,
                  density=float(scenario["context_targets"]["distractor_density"]),
              )
              wire_context, wire_manifest = client.compact_accb_context(context)
              if wire_manifest["logical_whitespace_tokens"] != 32768:
                  raise RuntimeError("compact_logical_token_target_mismatch")
              checkpoint = str(scenario["events"][5]["payload"])
              task = checkpoint + (
                  " Return JSON only with keys old_policy_status, fallback_authorization_status, "
                  "budget_rub, current_policy, next_safe_step. Use statuses superseded/revoked where applicable."
              )
              model_body = client.build_response_body(
                  "[FILLER LEGEND] old = stale legacy fallback noise; n = neutral noise.\n"
                  + wire_context
                  + "\n\n[CHECKPOINT]\n"
                  + task,
                  max_output_tokens=256,
                  stream=True,
              )
              receipt.update(
                  {
                      "snapshot": snapshot,
                      "logical_context_tokens": manifest["logical_whitespace_tokens"],
                      "context_sha256": manifest["context_sha256"],
                      **wire_manifest,
                      "exact_model_request_body_bytes": len(model_body),
                      "exact_model_request_body_sha256": hashlib.sha256(model_body).hexdigest(),
                  }
              )

              if len(model_body) >= 98304:
                  raise RuntimeError("compact_model_body_exceeds_observed_complete_upload_bound")
              targets = sorted({65536, len(model_body)})
              uploads = []
              receipt["uploads"] = uploads

              def synthetic_transport_body(target):
                  prefix = b'{"padding":"'
                  suffix = b'"}'
                  padding = target - len(prefix) - len(suffix)
                  if padding < 0:
                      raise RuntimeError("synthetic_transport_target_too_small")
                  body = prefix + (b"A" * padding) + suffix
                  if len(body) != target:
                      raise RuntimeError("synthetic_body_size_mismatch")
                  return body

              for target in targets:
                  synthetic_body = synthetic_transport_body(target)
                  try:
                      result = client.request(
                          method="POST",
                          url="https://httpbin.org/post",
                          proxy=proxy,
                          headers={
                              "Accept": "application/json",
                              "Content-Type": "application/json",
                              "User-Agent": "aimeton-accb-large-body-no-paid-preflight",
                          },
                          body=synthetic_body,
                          connect_timeout_seconds=30,
                          total_timeout_seconds=900,
                      )
                      item = {
                          "target_bytes": target,
                          "http_status": result.http_status,
                          "completion_signal": "http_response_after_complete_upload",
                          "response_sha256": hashlib.sha256(result.body).hexdigest(),
                          **result.metrics,
                      }
                      if result.http_status != 200:
                          raise RuntimeError(f"unexpected_transport_http_{result.http_status}_at_{target}")
                  except client.CurlTransportError as exc:
                      if exc.failure_class != "empty_response" or not exc.metrics.get("upload_complete"):
                          raise
                      item = {
                          "target_bytes": target,
                          "http_status": exc.metrics.get("http_status"),
                          "completion_signal": "empty_response_after_complete_upload",
                          **exc.metrics,
                      }
                  elapsed = float(item.get("time_total_seconds") or 0)
                  if elapsed > 0:
                      item["effective_upload_bytes_per_second"] = round(target / elapsed, 3)
                  uploads.append(item)
                  if item.get("uploaded_bytes") != target:
                      raise RuntimeError(f"incomplete_socks5_upload_at_{target}")
              receipt["uploads"] = uploads

              key_after_result = client.authenticated_get(
                  url=client.OPENROUTER_KEY_URL,
                  proxy=proxy,
                  api_key=key,
                  total_timeout_seconds=90,
              )
              if key_after_result.http_status != 200:
                  raise RuntimeError(f"openrouter_key_postflight_http_{key_after_result.http_status}")
              receipt["key_after"] = sanitized_key_state(key_after_result)
              usage_fields = ("usage", "usage_daily", "usage_weekly", "usage_monthly")
              receipt["key_usage_unchanged"] = all(
                  receipt["key_before"].get(name) == receipt["key_after"].get(name)
                  for name in usage_fields
              )
              if not receipt["key_usage_unchanged"]:
                  raise RuntimeError("openrouter_key_usage_changed_during_no_paid_gate")
              receipt["status"] = "OPENROUTER_PROXY_LARGE_BODY_PREFLIGHT_COMPLETE"
          except client.CurlTransportError as exc:
              receipt["failure_class"] = exc.failure_class
              receipt["failure_metrics"] = exc.metrics
          except Exception as exc:
              receipt["failure_class"] = str(exc)[:160]

          pathlib.Path("/tmp/accb-openrouter-proxy-large-body.json").write_text(
              json.dumps(receipt, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Publish sanitized receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path("/tmp/accb-openrouter-proxy-large-body.json")
          receipt = json.loads(path.read_text()) if path.exists() else {"status": "PREFLIGHT_DID_NOT_EMIT_RECEIPT"}
          body = "\n".join(
              [
                  "## ACCB OpenRouter proxy large-body no-paid preflight",
                  "",
                  f"- exact SHA: `{os.environ['EXPECTED_SHA']}`",
                  f"- runner: `{os.environ.get('RUNNER_NAME')}`",
                  f"- status: **{receipt.get('status')}**",
                  f"- logical context tokens: `{receipt.get('logical_context_tokens')}`",
                  f"- wire filler corpus: `{receipt.get('wire_filler_corpus_version')}`",
                  f"- wire context bytes: `{receipt.get('wire_context_bytes')}`",
                  f"- wire context digest: `{receipt.get('wire_context_sha256')}`",
                  f"- exact model-body bytes: `{receipt.get('exact_model_request_body_bytes')}`",
                  f"- exact model-body digest: `{receipt.get('exact_model_request_body_sha256')}`",
                  f"- synthetic upload results: `{json.dumps(receipt.get('uploads') or [], sort_keys=True)}`",
                  f"- key state before: `{json.dumps(receipt.get('key_before') or {}, sort_keys=True)}`",
                  f"- key state after: `{json.dumps(receipt.get('key_after') or {}, sort_keys=True)}`",
                  "- model generation requests: `0`",
                  "- paid spend authorized: `0 RUB`",
                  f"- proxy transport: `{receipt.get('proxy_transport')}`",
                  "- Authorization sent to synthetic transport target: `false`",
                  f"- key usage unchanged: `{receipt.get('key_usage_unchanged')}`",
                  "- automatic retries: `0`",
                  "- proxy value retained: `false`",
                  "- raw transport response retained: `false`",
                  f"- failure class: `{receipt.get('failure_class')}`",
                  f"- failure metrics: `{json.dumps(receipt.get('failure_metrics') or {}, sort_keys=True)}`",
              ]
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY
      - name: Enforce no-paid transport result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          receipt = json.loads(pathlib.Path("/tmp/accb-openrouter-proxy-large-body.json").read_text())
          assert receipt["model_generation_requests"] == 0
          assert receipt["paid_spend_authorized_rub"] == 0
          assert receipt["authorization_header_sent_to_transport_target"] is False
          assert receipt["proxy_transport"] == "socks5h"
          assert receipt["exact_model_request_body_bytes"] < 98304
          assert all(item.get("upload_complete") is True for item in receipt["uploads"])
          assert all(
              item.get("completion_signal") in {
                  "http_response_after_complete_upload",
                  "empty_response_after_complete_upload",
              }
              for item in receipt["uploads"]
          )
          assert receipt["key_usage_unchanged"] is True
          assert receipt["automatic_retries"] == 0
          if receipt["status"] != "OPENROUTER_PROXY_LARGE_BODY_PREFLIGHT_COMPLETE":
              raise SystemExit(receipt["status"])
          PY
