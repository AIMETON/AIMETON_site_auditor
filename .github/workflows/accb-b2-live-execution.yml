name: ACCB B2 Governed Live Execution

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      evidence_issue:
        required: true
        default: "798"
        type: string
      owner_spend_authorized:
        required: true
        type: string
      max_budget_rub:
        required: true
        default: "10000"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: accb-b2-governed-live-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    environment: stage
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ACCB_B2_EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      ACCB_B2_MAX_BUDGET_RUB: ${{ inputs.max_budget_rub }}
      OWNER_SPEND_AUTHORIZED: ${{ inputs.owner_spend_authorized }}
      B2_ARCHITECTURE_SHA: d390b2f56c0b2dae4be0cc4810dcb86403f2dc26
      B2_OUTPUT_POLICY_SHA: 4c2ee2afbc85c6ae5fcabffac86bd33304273338
      B2_REASONING_POLICY_SHA: b44127abe77315b6ee50c6167e07d88f0116f726
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Require exact owner-authorized execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ACCB_B2_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$OWNER_SPEND_AUTHORIZED" = "true"
          python3 - <<'PY'
          import os
          assert float(os.environ["ACCB_B2_MAX_BUDGET_RUB"]) == 10000.0
          assert os.environ["B2_ARCHITECTURE_SHA"] == "d390b2f56c0b2dae4be0cc4810dcb86403f2dc26"
          assert os.environ["B2_OUTPUT_POLICY_SHA"] == "4c2ee2afbc85c6ae5fcabffac86bd33304273338"
          assert os.environ["B2_REASONING_POLICY_SHA"] == "b44127abe77315b6ee50c6167e07d88f0116f726"
          assert os.environ.get("ROUTERAI_API_KEY","").strip()
          assert os.environ.get("OPENROUTER_API_KEY","").strip()
          PY

      - name: Materialize exact Site Auditor source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$ACCB_B2_EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$ACCB_B2_EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$ACCB_B2_EXPECTED_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"

      - name: Bind frozen B2 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="docs/research/accb_b2_snapshot/$B2_ARCHITECTURE_SHA"
          test -f "$ROOT/generate_accb_b2_information_load.py"
          test -f "$ROOT/score_accb_b2_trace.py"
          test -f scripts/accb_b2_endpoint_capability_census.py
          test -f scripts/accb_b2_live_execution.py
          ! grep -F 'MAX_OUTPUT_TOKENS = 8192' scripts/accb_b2_live_execution.py
          ! grep -F '"effort": "low"' scripts/accb_b2_live_execution.py

      - name: Execute governed 25-cell B2 tranche
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/accb-b2-live-$GITHUB_RUN_ID.json"
          python3 scripts/accb_b2_live_execution.py --output "$OUT"
          rc=$?
          echo "ACCB_B2_LIVE_RC=$rc" >> "$GITHUB_ENV"
          echo "ACCB_B2_LIVE_RECEIPT=$OUT" >> "$GITHUB_ENV"
          exit 0

      - name: Publish sanitized B2 evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          path=pathlib.Path(os.environ.get("ACCB_B2_LIVE_RECEIPT",""))
          if path.is_file():
              p=json.loads(path.read_text(encoding="utf-8"))
              lines=[
                "## ACCB B2 Information Load governed live execution",
                "",
                f"- exact Site Auditor SHA: {p.get('site_auditor_sha')}",
                f"- frozen B2 Architecture SHA: {p.get('b2_architecture_sha')}",
                f"- output policy SHA: {p.get('output_policy_sha')}",
                f"- status: {p.get('status')}",
                f"- common output ceiling: {p.get('common_output_ceiling_tokens')} tokens",
                f"- fresh 25-cell guard: {(p.get('fresh_census') or {}).get('whole_25_cell_cost_rub_guard')} RUB",
                f"- accounted/guarded spend: {p.get('accounted_spend_rub')} RUB",
                f"- completed/scored/integration: {p.get('completed_cells')}/{p.get('scored_cells')}/{p.get('terminal_integration_cells')}",
                f"- model-output contract failures: {p.get('model_output_contract_failure_cells')}",
                f"- output-budget exhausted cells: {p.get('output_budget_exhausted_cells')}",
                f"- harness failures: {p.get('harness_failure_cells')}",
                "- retries: 0",
                "- fallbacks: false",
                "- forced low reasoning effort: false",
                "- raw prompt/completion/reasoning retained: false",
                "",
                "| model | tier | bytes | events/auth | provider input | output/reasoning/final | finish | status | ACI_B2 | ACI_min | cost RUB |",
                "|---|---|---:|---:|---:|---|---|---|---:|---:|---:|",
              ]
              for r in p.get("cells") or []:
                  finish=r.get("finish_reason") or r.get("response_status") or r.get("incomplete_reason")
                  of=f"{r.get('provider_output_tokens')}/{r.get('provider_reasoning_tokens')}/{r.get('provider_final_answer_tokens')}"
                  ea=f"{r.get('event_count')}/{r.get('authoritative_transition_count')}"
                  lines.append(
                    f"| {r.get('model')} | {r.get('tier_id')} | {r.get('request_text_bytes')} | {ea} | "
                    f"{r.get('provider_input_tokens')} | {of} | {finish} | {r.get('status')} | "
                    f"{r.get('ACI_B2')} | {r.get('ACI_B2_min')} | {r.get('accounted_cost_rub')} |"
                  )
              compact={
                "experiment_id":p.get("experiment_id"),
                "completion_criterion_met":p.get("completion_criterion_met"),
                "non_scored_cells":[
                  {
                    "model":r.get("model"),
                    "tier_id":r.get("tier_id"),
                    "status":r.get("status"),
                    "error_type":r.get("error_type"),
                    "error_message_sha256":r.get("error_message_sha256"),
                    "finish_reason":r.get("finish_reason"),
                    "response_status":r.get("response_status"),
                    "provider_output_tokens":r.get("provider_output_tokens"),
                    "provider_reasoning_tokens":r.get("provider_reasoning_tokens"),
                  }
                  for r in p.get("cells") or [] if r.get("status") != "SCORED"
                ],
              }
              lines += ["","SANITIZED_JSON:",json.dumps(compact,sort_keys=True)]
              body="\n".join(lines)
          else:
              body="\n".join([
                "## ACCB B2 Information Load governed live execution",
                "",
                f"- exact Site Auditor SHA: {os.environ.get('ACCB_B2_EXPECTED_SHA')}",
                "- status: EXECUTION_DID_NOT_EMIT_RECEIPT",
                "- no cognition score inferred from missing receipt",
              ])
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
            data=json.dumps({"body":body}).encode(),
            method="POST",
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
            },
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              assert response.status in (200,201)
          PY

      - name: Enforce B2 completion contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$ACCB_B2_LIVE_RECEIPT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["experiment_id"] == "ACCB-B2-INFOLOAD-DIAGNOSTIC-v0.1"
          assert p["planned_cells"] == 25
          assert p["completed_cells"] == 25
          assert p["provider_generation_attempts_total"] == 25
          assert p["silent_retries"] == 0
          assert p["fallbacks"] is False
          assert p["common_output_ceiling_tokens"] == 128000
          assert p["legacy_global_8192_output_cap_allowed"] is False
          assert p["forced_low_reasoning_effort"] is False
          assert p["raw_prompt_retained"] is False
          assert p["raw_completion_retained"] is False
          assert p["raw_provider_reasoning_retained"] is False
          assert p["fresh_census"]["whole_25_cell_cost_rub_guard"] <= 10000
          assert p["accounted_spend_rub"] <= 10000
          assert all(r["provider_generation_attempts"] == 1 for r in p["cells"])
          assert p["harness_failure_cells"] == 0
          assert p["status"] == "ACCB_B2_EXECUTION_COMPLETE"
          assert p["completion_criterion_met"] is True
          PY
          test "${ACCB_B2_LIVE_RC:-99}" = "0"
