name: Deploy Stage

on:
  workflow_run:
    workflows:
      - Baseline CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy; leave empty to deploy selected ref
        required: false
        type: string

permissions:
  actions: write
  contents: read

env:
  STACK_DIR: /opt/aimeton/auditor-stack
  STAGE_URL: https://stage-auditor.aimeton.ru

concurrency:
  group: aimeton-auditor-stage
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    environment: stage
    timeout-minutes: 30
    env:
      BACKUP_KEEP: ${{ vars.STAGE_BACKUP_KEEP || '5' }}
      FAILED_KEEP: ${{ vars.STAGE_FAILED_KEEP || '2' }}
      TAVILY_SEARCH_COST_USD: ${{ vars.TAVILY_SEARCH_COST_USD || '0.008' }}
      SEARCH_MISSION_BUDGET_USD: ${{ vars.SEARCH_MISSION_BUDGET_USD || '0.008' }}
      SEARCH_QUOTA_TAVILY: ${{ vars.SEARCH_QUOTA_TAVILY || '10' }}
      YANDEX_SEARCH_COST_RUB: ${{ vars.YANDEX_SEARCH_COST_RUB || '0.01' }}
      SEARCH_MISSION_BUDGET_RUB: ${{ vars.SEARCH_MISSION_BUDGET_RUB || '0.01' }}
      SEARCH_QUOTA_YANDEX: ${{ vars.SEARCH_QUOTA_YANDEX || '10' }}
      SEARCH_PROVIDER_ORDER: ${{ vars.SEARCH_PROVIDER_ORDER || 'yandex,tavily,searxng' }}
      SEARCH_ALLOW_PAID_FALLBACK: 'true'
      SEARCH_EFFECTIVENESS_DEBUG: 'true'
      IDENTITY_SEARCH_PROVIDER_ORDER: ${{ vars.IDENTITY_SEARCH_PROVIDER_ORDER || 'yandex,tavily,searxng' }}
      IDENTITY_SEARCH_ALLOW_PAID_FALLBACK: 'true'
      IDENTITY_AUTHORITY_HOSTS: ${{ vars.IDENTITY_AUTHORITY_HOSTS || 'egrul.nalog.ru,service.nalog.ru,bo.nalog.ru' }}

    steps:
      - name: Resolve exact deployment SHA
        id: target
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sha="${WORKFLOW_RUN_SHA:-}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="${MANUAL_SHA:-$FALLBACK_SHA}"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid deployment SHA: $sha" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $sha"

      - name: Materialize exact commit with local reuse and bounded retry
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init
          fi
          if git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
            echo "Reusing locally available exact commit $DEPLOY_SHA"
            git checkout --detach --force "$DEPLOY_SHA"
          else
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
            fetched=false
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --depth=1 origin "$DEPLOY_SHA"; then
                fetched=true
                break
              fi
              test "$attempt" -lt 5
              sleep $(( attempt * attempt + 1 ))
            done
            test "$fetched" = true
            git checkout --detach --force FETCH_HEAD
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            trap - EXIT
          fi
          git reset --hard "$DEPLOY_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Verify checkout identity
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected: $DEPLOY_SHA"
          echo "Actual:   $actual"
          [[ "$actual" == "$DEPLOY_SHA" ]]

      - name: Validate local stage preflight without package installation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$STACK_DIR"
          test -f "$STACK_DIR/docker-compose.yml"
          command -v docker >/dev/null
          docker info >/dev/null
          curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/health" >/dev/null
          echo "Local stage preflight passed; no PyPI or runtime package installation used"

      - name: Validate provider configuration contract
        shell: bash
        env:
          TAVILY_TOKEN: ${{ secrets.TAVILY_TOKEN }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          set -Eeuo pipefail
          test -n "$TAVILY_TOKEN" || { echo "Missing required stage secret: TAVILY_TOKEN" >&2; exit 1; }
          test -n "$YANDEX_SEARCH_API_KEY" || { echo "Missing required stage secret: YANDEX_SEARCH_API_KEY" >&2; exit 1; }
          test -n "$YANDEX_CLOUD_FOLDER_ID" || { echo "Missing required stage variable: YANDEX_CLOUD_FOLDER_ID" >&2; exit 1; }
          echo "Search effectiveness debug mode enabled for Stage"

      - name: Deploy transactionally to stage
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          SOURCE_DIR: ${{ github.workspace }}
          TAVILY_TOKEN: ${{ secrets.TAVILY_TOKEN }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-evidence
          chmod +x scripts/deploy_stage.sh
          scripts/deploy_stage.sh 2>&1 | tee "deployment-evidence/deploy-${DEPLOY_SHA}.log"

      - name: Dispatch DaData Stage after successful deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/dadata-dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/configure-dadata-stage.yml/dispatches")"
          rm -f "$RUNNER_TEMP/dadata-dispatch-response.txt"
          test "$code" = 204
          echo "dadata_dispatch=ok"

      - name: Record final stage evidence
        if: always()
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          mkdir -p deployment-evidence
          evidence="deployment-evidence/final-state-${DEPLOY_SHA}.txt"
          {
            echo "requested_sha=$DEPLOY_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "actor=$GITHUB_ACTOR"
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "bundle_sha=$(cat "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
            echo "dependency_installation=disabled"
            echo "marketplace_actions_on_stage_runner=disabled"
            echo "search_provider_order=$SEARCH_PROVIDER_ORDER"
            echo "identity_provider_order=$IDENTITY_SEARCH_PROVIDER_ORDER"
            echo "search_effectiveness_debug=$SEARCH_EFFECTIVENESS_DEBUG"
            docker ps --filter name=aimeton-auditor --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
            curl -sS -D - -o /dev/null --max-redirs 0 "$STAGE_URL/mcp" || true
            curl -sS "$STAGE_URL/api/health" || true
          } | tee "$evidence"

          mkdir -p "$STACK_DIR/deployment-evidence"
          chmod 700 "$STACK_DIR/deployment-evidence"
          cp "$evidence" "$STACK_DIR/deployment-evidence/"
          chmod 600 "$STACK_DIR/deployment-evidence/$(basename "$evidence")"
          find "$STACK_DIR/deployment-evidence" -type f -name 'final-state-*.txt' -mtime +30 -delete 2>/dev/null || true

          {
            echo '## Stage deployment evidence'
            echo
            echo '```text'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
