name: AIMETON Command Router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: aimeton-command-router-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  route:
    if: >-
      github.event.comment.user.login == 'Dimar4713' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ROUTER_SHA: ${{ github.sha }}
    steps:
      - name: Materialize command router without marketplace actions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$ROUTER_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$ROUTER_SHA"
          git clean -ffdx
          test -f scripts/aimeton_command_router.py

      - name: Parse, authorize and dispatch one command
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/aimeton_command_router.py
