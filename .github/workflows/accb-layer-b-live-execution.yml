name: ACCB Layer B Governed Live Execution

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact Site Auditor SHA containing the admitted Layer B harness
        required: true
        type: string
      evidence_issue:
        description: Canonical Site Auditor evidence issue
        required: true
        default: "798"
        type: string
      owner_spend_authorized:
        description: Frozen first-stage owner authorization acknowledgement
        required: true
        type: string
      max_budget_rub:
        description: Absolute first-stage ceiling in RUB
        required: true
        default: "10000"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: accb-layer-b-live-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    environment: stage
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ACCB_EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      ACCB_MAX_BUDGET_RUB: ${{ inputs.max_budget_rub }}
      OWNER_SPEND_AUTHORIZED: ${{ inputs.owner_spend_authorized }}
      FROZEN_ARCHITECTURE_SHA: b47b937873ef980601b5c741af9b327fb18365bc
      EXECUTION_ADMISSION_SHA: 67c8ea3e84405884136119d7252fe7424ccf1631
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Require exact owner-authorized execution boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ACCB_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$OWNER_SPEND_AUTHORIZED" = "true"
          python3 - <<'PY'
          import os
          assert float(os.environ["ACCB_MAX_BUDGET_RUB"]) == 10000.0
          assert os.environ["FROZEN_ARCHITECTURE_SHA"] == "b47b937873ef980601b5c741af9b327fb18365bc"
          assert os.environ["EXECUTION_ADMISSION_SHA"] == "67c8ea3e84405884136119d7252fe7424ccf1631"
          assert os.environ.get("ROUTERAI_API_KEY", "").strip()
          assert os.environ.get("OPENROUTER_API_KEY", "").strip()
          PY

      - name: Materialize exact Site Auditor source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$ACCB_EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$ACCB_EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$ACCB_EXPECTED_SHA"
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"

      - name: Bind exact frozen Layer B snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCH="$GITHUB_WORKSPACE/docs/research/accb_layer_b_snapshot/$FROZEN_ARCHITECTURE_SHA"
          test -f "$ARCH/SNAPSHOT_MANIFEST.json"
          test -f "$ARCH/ACCB-DEV-004.scenario.json"
          test -f "$ARCH/ACCB-DEV-004.gold-ledger.json"
          test -f "$ARCH/candidate_trace.schema.json"
          test -f "$ARCH/score_accb_trace.py"
          test -f "$GITHUB_WORKSPACE/docs/research/ACCB_LAYER_B_COMMON_PAYLOAD_SCHEDULE_v0.3.json"
          echo "ACCB_ARCHITECTURE_ROOT=$ARCH" >> "$GITHUB_ENV"

      - name: Execute frozen tokenizer-free 15-cell Layer B tranche
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/accb-layer-b-live-$GITHUB_RUN_ID.json"
          python3 scripts/accb_layer_b_live_execution.py \
            --architecture-root "$ACCB_ARCHITECTURE_ROOT" \
            --output "$OUT"
          rc=$?
          echo "ACCB_LIVE_RC=$rc" >> "$GITHUB_ENV"
          echo "ACCB_LIVE_RECEIPT=$OUT" >> "$GITHUB_ENV"
          exit 0

      - name: Publish sanitized Layer B evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path(os.environ.get("ACCB_LIVE_RECEIPT", ""))
          if path.is_file():
              p = json.loads(path.read_text(encoding="utf-8"))
              lines = [
                  "## ACCB Layer B governed live execution v0.2",
                  "",
                  f"- exact Site Auditor SHA: `{p.get('site_auditor_sha')}`",
                  f"- frozen Architecture SHA: `{p.get('frozen_architecture_sha')}`",
                  f"- execution admission SHA: `{p.get('execution_admission_sha')}`",
                  f"- status: **{p.get('status')}**",
                  f"- fresh 15-cell guard: `{(p.get('fresh_census') or {}).get('whole_tranche_conservative_guard_rub')} RUB`",
                  f"- accounted spend guard: `{p.get('accounted_spend_rub_guard')} RUB`",
                  f"- completed/scored/integration: `{p.get('completed_cells')}/{p.get('scored_cells')}/{p.get('terminal_integration_cells')}`",
                  f"- primary cross-model input axis: `{p.get('primary_cross_model_input_axis')}`",
                  f"- provider-token role: `{p.get('provider_input_tokens_role')}`",
                  f"- provider-input measured/degraded: `{p.get('measured_provider_input_cells')}/{p.get('measurement_degraded_cells')}`",
                  f"- unscorable outputs: `{p.get('unscorable_model_output_cells')}`",
                  f"- harness failures: `{p.get('harness_failure_cells')}`",
                  "- tokenizer required at execution: `false`",
                  "- provider generation attempts: exactly one per cell",
                  "- automatic retries: `0`",
                  "- fallbacks: `false`",
                  "- raw prompt/completion/reasoning retained: `false`",
                  "",
                  "| model | payload bytes | payload SHA256 | provider tokens (diagnostic) | measurement | status | ACI | ACI_min | cost guard RUB |",
                  "|---|---:|---|---:|---|---|---:|---:|---:|",
              ]
              for row in p.get("cells") or []:
                  status = str(row.get("status") or "")
                  critical = row.get("critical_failures") or []
                  if critical:
                      status += " / CF:" + str(len(critical))
                  lines.append(
                      "| {model} | {bytes} | {payload_sha} | {provider} | {measurement} | {status} | {aci} | {aci_min} | {cost} |".format(
                          model=row.get("model"),
                          bytes=row.get("request_text_bytes"),
                          payload_sha=row.get("payload_sha256"),
                          provider=row.get("L_model_input_provider"),
                          measurement=row.get("measurement_status"),
                          status=status.replace("|", "/"),
                          aci=row.get("ACI"),
                          aci_min=row.get("ACI_min"),
                          cost=row.get("accounted_cost_rub_guard"),
                      )
                  )
              compact = {
                  "experiment_id": p.get("experiment_id"),
                  "completion_criterion_met": p.get("completion_criterion_met"),
                  "tokenizer_required_at_execution": p.get("tokenizer_required_at_execution"),
                  "payload_hashes": [
                      {
                          "model": row.get("model"),
                          "anchor": row.get("nominal_anchor"),
                          "payload_sha256": row.get("payload_sha256"),
                          "candidate_trace_sha256": row.get("candidate_trace_sha256"),
                      }
                      for row in p.get("cells") or []
                  ],
              }
              lines.extend(["", "```json", json.dumps(compact, sort_keys=True, indent=2), "```"])
              body = "\n".join(lines)
          else:
              body = "\n".join([
                  "## ACCB Layer B governed live execution v0.2",
                  "",
                  f"- exact Site Auditor SHA: `{os.environ.get('ACCB_EXPECTED_SHA')}`",
                  "- status: **EXECUTION_DID_NOT_EMIT_RECEIPT**",
                  "- no cognition score inferred from missing receipt",
              ])

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY

      - name: Enforce frozen completion contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$ACCB_LIVE_RECEIPT" <<'PY'
          import json
          import sys

          p = json.load(open(sys.argv[1], encoding="utf-8"))
          assert p["frozen_architecture_sha"] == "b47b937873ef980601b5c741af9b327fb18365bc"
          assert p["execution_admission_sha"] == "67c8ea3e84405884136119d7252fe7424ccf1631"
          assert p["tokenizer_required_at_execution"] is False
          assert p["primary_cross_model_input_axis"] == "request_text_bytes"
          assert p["payload_identity_field"] == "payload_sha256"
          assert p["planned_cells"] == 15
          assert p["completed_cells"] == 15
          assert p["one_scored_call_per_cell"] is True
          assert p["silent_retries"] == 0
          assert p["fallbacks"] is False
          assert p["raw_prompt_retained"] is False
          assert p["raw_completion_retained"] is False
          assert p["raw_provider_reasoning_retained"] is False
          assert p["fresh_census"]["whole_tranche_conservative_guard_rub"] <= 10000
          assert all(row["provider_generation_attempts"] == 1 for row in p["cells"])
          assert all(
              row["status"].startswith("SCORED") or row["status"].startswith("INTEGRATION_FAILURE") or row["status"] == "TRANSPORT_FAILURE"
              for row in p["cells"]
          )
          assert p["status"] == "ACCB_LAYER_B_EXECUTION_COMPLETE"
          assert p["completion_criterion_met"] is True
          PY
          test "${ACCB_LIVE_RC:-99}" = "0"
