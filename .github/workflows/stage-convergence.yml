name: Stage Convergence

on:
  workflow_run:
    workflows:
      - Deploy Stage
      - Configure DaData Stage
      - Runtime Persistence Reconcile
      - Stage Auth Persistence Guard
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact deployed source SHA to converge
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aimeton-stage-convergence
  cancel-in-progress: false

env:
  STACK_DIR: /opt/aimeton/auditor-stack
  STAGE_URL: https://stage-auditor.aimeton.ru
  CONTAINER: aimeton-auditor

jobs:
  resolve-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ready: ${{ steps.resolve.outputs.ready }}
      deploy_run_id: ${{ steps.resolve.outputs.deploy_run_id }}
      dadata_run_id: ${{ steps.resolve.outputs.dadata_run_id }}
      persistence_run_id: ${{ steps.resolve.outputs.persistence_run_id }}
      auth_guard_run_id: ${{ steps.resolve.outputs.auth_guard_run_id }}
    steps:
      - name: Materialize convergence resolver with local reuse and bounded retry
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-convergence-resolver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "Reusing locally available exact commit $TARGET_SHA"
            git checkout --detach --force "$TARGET_SHA"
          else
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
            fetched=false
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --depth=1 origin "$TARGET_SHA"; then fetched=true; break; fi
              test "$attempt" -lt 5
              sleep $(( attempt * attempt + 1 ))
            done
            test "$fetched" = true
            git checkout --detach --force FETCH_HEAD
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            trap - EXIT
          fi
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f scripts/resolve_stage_convergence_gates.py

      - name: Resolve exact SHA and probe required post-deploy gates
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/resolve_stage_convergence_gates.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --manual-sha "${MANUAL_SHA:-}" \
            --github-output "$GITHUB_OUTPUT"

  publish-marker:
    needs: resolve-gates
    if: needs.resolve-gates.outputs.ready == 'true'
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    steps:
      - name: Materialize exact deployed convergence tooling with local reuse and bounded retry
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test -f app-source-sha.txt
          test "$(cat app-source-sha.txt)" = "$EXPECTED_SHA"

          cd "$GITHUB_WORKSPACE"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-convergence-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          if git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
            echo "Reusing locally available exact commit $EXPECTED_SHA"
            git checkout --detach --force "$EXPECTED_SHA"
          else
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
            fetched=false
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"; then fetched=true; break; fi
              test "$attempt" -lt 5
              sleep $(( attempt * attempt + 1 ))
            done
            test "$fetched" = true
            git checkout --detach --force FETCH_HEAD
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            trap - EXIT
          fi
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f scripts/write_stage_convergence_marker.py
          echo "Convergence tooling source SHA: $EXPECTED_SHA"

      - name: Verify live Stage invariants before convergence publication
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test "$(cat app-source-sha.txt)" = "$EXPECTED_SHA"

          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          test "$status" = healthy

          mount="$(docker inspect "$CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}')"
          test -n "$mount"
          IFS='|' read -r mount_type mount_source mount_destination <<< "$mount"
          test "$mount_type" = bind
          test "$mount_destination" = /app/data
          test "$(readlink -f "$mount_source")" = "$(readlink -f "$STACK_DIR/data/runtime-core")"

          health="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/health")"
          python3 - "$health" "$EXPECTED_SHA" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('status') == 'ok', payload
          assert payload.get('deployment_sha') == sys.argv[2], payload
          PY

          convergence="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$convergence" "$EXPECTED_SHA" <<'PY'
          import json, re, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('deployment_sha') == sys.argv[2], payload
          assert re.fullmatch(r'[0-9a-f]{32}', payload.get('runtime_instance_id') or ''), payload
          assert payload.get('secrets_exposed') is False, payload
          PY

          dadata="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/missions/registry-mirror/dadata/health")"
          python3 - "$dadata" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('provider') == 'dadata', payload
          assert payload.get('state') == 'active', payload
          assert payload.get('secrets_exposed') is False, payload
          PY

          docker exec -i "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          runtime=Path(os.environ.get('AIMETON_RUNTIME_DB','data/runtime-core.sqlite3'))
          auth=Path(os.environ.get('AIMETON_AUTH_DB','data/auth.sqlite3'))
          for path in (runtime, auth):
              assert path.exists(), path
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as db:
                  assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          with sqlite3.connect(f'file:{auth}?mode=ro', uri=True) as db:
              admins=db.execute("SELECT COUNT(*) FROM users WHERE role='admin' AND is_active=1").fetchone()[0]
              assert admins >= 1
          PY

      - name: Publish restart-aware exact-SHA convergence marker
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
          DEPLOY_RUN_ID: ${{ needs.resolve-gates.outputs.deploy_run_id }}
          DADATA_RUN_ID: ${{ needs.resolve-gates.outputs.dadata_run_id }}
          PERSISTENCE_RUN_ID: ${{ needs.resolve-gates.outputs.persistence_run_id }}
          AUTH_GUARD_RUN_ID: ${{ needs.resolve-gates.outputs.auth_guard_run_id }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/write_stage_convergence_marker.py \
            --expected-sha "$EXPECTED_SHA" \
            --deploy-run-id "$DEPLOY_RUN_ID" \
            --dadata-run-id "$DADATA_RUN_ID" \
            --persistence-run-id "$PERSISTENCE_RUN_ID" \
            --auth-guard-run-id "$AUTH_GUARD_RUN_ID"

          snapshot="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$snapshot" "$EXPECTED_SHA" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('state') == 'converged', payload
          assert payload.get('deployment_sha') == sys.argv[2], payload
          assert payload.get('marker_error') is None, payload
          assert payload.get('secrets_exposed') is False, payload
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

      - name: Record sanitized convergence evidence locally and in summary
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
        run: |
          set +e
          cd "$STACK_DIR"
          evidence_dir="$STACK_DIR/deployment-evidence/stage-convergence-${GITHUB_RUN_ID}"
          install -d -m 0700 "$evidence_dir"
          curl -sS "$STAGE_URL/api/runtime/convergence" > "$evidence_dir/runtime-convergence.json" || true
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bundle_sha=$(cat app-source-sha.txt 2>/dev/null || echo unavailable)"
            echo "marketplace_actions_on_stage_runner=disabled"
            docker ps --filter name="$CONTAINER" --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
          } > "$evidence_dir/final-state.txt"
          chmod 0600 "$evidence_dir"/* 2>/dev/null || true
          find "$STACK_DIR/deployment-evidence" -mindepth 1 -maxdepth 1 -type d -name 'stage-convergence-*' -mtime +30 -exec rm -rf {} + 2>/dev/null || true
          {
            echo '## Stage convergence evidence'
            echo
            echo '```text'
            cat "$evidence_dir/final-state.txt"
            echo '```'
            echo
            echo '### Runtime convergence snapshot'
            echo
            echo '```json'
            cat "$evidence_dir/runtime-convergence.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
