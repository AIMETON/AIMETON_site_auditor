name: One-Time Stale Branch Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-stale-branch-cleanup.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-stale-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      WORKFLOW_PATH: .github/workflows/one-time-stale-branch-cleanup.yml
    steps:
      - name: Delete only stale closed-PR and explicit experiment/temp branches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AIMETON-one-time-branch-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read()
                  return json.loads(body.decode("utf-8")) if body else None

          def paginate(path):
              out = []
              for page in range(1, 30):
                  sep = "&" if "?" in path else "?"
                  rows = request(f"{api}{path}{sep}per_page=100&page={page}")
                  if not rows:
                      break
                  out.extend(rows)
                  if len(rows) < 100:
                      break
              return out

          open_prs = paginate("/pulls?state=open")
          if open_prs:
              raise SystemExit(f"Refusing cleanup: {len(open_prs)} open PR(s) exist")

          closed_prs = paginate("/pulls?state=closed")
          closed_heads = {
              pr.get("head", {}).get("ref")
              for pr in closed_prs
              if pr.get("head", {}).get("ref")
          }
          branches = paginate("/branches")

          def explicit_stale(name):
              return (
                  name.startswith("accb/")
                  or name.startswith("research/accb")
                  or name.startswith("diagnostics/accb")
                  or name.startswith("experiment/accb")
                  or name == "tmp"
                  or name.startswith("noop")
                  or name.startswith("ops/temp")
              )

          candidates = sorted(
              b["name"]
              for b in branches
              if b["name"] != default_branch
              and not b.get("protected", False)
              and (b["name"] in closed_heads or explicit_stale(b["name"]))
          )

          deleted = []
          failures = []
          for name in candidates:
              encoded = urllib.parse.quote(name, safe="")
              url = f"{api}/git/refs/heads/{encoded}"
              try:
                  request(url, method="DELETE")
                  deleted.append(name)
              except Exception as exc:
                  failures.append({"branch": name, "error": str(exc)})

          result = {
              "branches_before": len(branches),
              "closed_prs": len(closed_prs),
              "candidate_count": len(candidates),
              "deleted_count": len(deleted),
              "failure_count": len(failures),
              "deleted": deleted,
              "failures": failures,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## One-time stale branch cleanup\n\n")
              fh.write(f"- branches before: **{len(branches)}**\n")
              fh.write(f"- candidates: **{len(candidates)}**\n")
              fh.write(f"- deleted: **{len(deleted)}**\n")
              fh.write(f"- failures: **{len(failures)}**\n")
          if failures:
              raise SystemExit("Some branch deletions failed; workflow file retained for investigation")
          PY

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = os.environ["WORKFLOW_PATH"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AIMETON-one-time-branch-cleanup",
          }
          encoded = urllib.parse.quote(path, safe="/")
          get_req = urllib.request.Request(f"{api}/contents/{encoded}?ref=main", headers=headers)
          with urllib.request.urlopen(get_req, timeout=60) as resp:
              meta = json.loads(resp.read().decode("utf-8"))
          payload = json.dumps({
              "message": "Remove one-time stale branch cleanup workflow",
              "sha": meta["sha"],
              "branch": "main",
          }).encode("utf-8")
          del_req = urllib.request.Request(
              f"{api}/contents/{encoded}",
              data=payload,
              method="DELETE",
              headers=headers,
          )
          with urllib.request.urlopen(del_req, timeout=60) as resp:
              response = json.loads(resp.read().decode("utf-8"))
          print(json.dumps({"self_removed": True, "commit": response["commit"]["sha"]}))
          PY
