name: One-Time Old Branch Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-old-branch-cleanup.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-old-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: main
      WORKFLOW_PATH: .github/workflows/one-time-old-branch-cleanup.yml
    steps:
      - name: Delete old non-main branches with no open PR
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AIMETON-one-time-old-branch-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read()
                  return json.loads(body.decode("utf-8")) if body else None

          def paginate(path):
              out = []
              for page in range(1, 30):
                  sep = "&" if "?" in path else "?"
                  rows = request(f"{api}{path}{sep}per_page=100&page={page}")
                  if not rows:
                      break
                  out.extend(rows)
                  if len(rows) < 100:
                      break
              return out

          open_prs = paginate("/pulls?state=open")
          if open_prs:
              raise SystemExit(f"Refusing cleanup: {len(open_prs)} open PR(s) exist")

          closed_prs = paginate("/pulls?state=closed")
          closed_heads = {
              pr.get("head", {}).get("ref")
              for pr in closed_prs
              if pr.get("head", {}).get("ref")
          }
          branches = paginate("/branches")

          candidates = []
          retained = []
          for b in branches:
              name = b["name"]
              if name == default_branch or b.get("protected", False):
                  retained.append({"branch": name, "reason": "default_or_protected"})
                  continue
              sha = b["commit"]["sha"]
              commit = request(f"{api}/commits/{sha}")
              date_text = commit["commit"]["committer"]["date"]
              date = datetime.fromisoformat(date_text.replace("Z", "+00:00"))
              if name in closed_heads or date < cutoff:
                  candidates.append({"branch": name, "sha": sha, "commit_date": date_text})
              else:
                  retained.append({"branch": name, "reason": "fresh_unique", "commit_date": date_text})

          deleted = []
          failures = []
          for row in sorted(candidates, key=lambda x: x["branch"]):
              name = row["branch"]
              encoded = urllib.parse.quote(name, safe="")
              try:
                  request(f"{api}/git/refs/heads/{encoded}", method="DELETE")
                  deleted.append(row)
              except Exception as exc:
                  failures.append({"branch": name, "error": str(exc)})

          result = {
              "branches_before": len(branches),
              "cutoff_utc": cutoff.isoformat(),
              "candidate_count": len(candidates),
              "deleted_count": len(deleted),
              "retained_count": len(retained),
              "failure_count": len(failures),
              "retained": retained,
              "failures": failures,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## One-time old branch cleanup\n\n")
              fh.write(f"- branches before: **{len(branches)}**\n")
              fh.write(f"- cutoff: **{cutoff.isoformat()}**\n")
              fh.write(f"- candidates: **{len(candidates)}**\n")
              fh.write(f"- deleted: **{len(deleted)}**\n")
              fh.write(f"- retained: **{len(retained)}**\n")
              fh.write(f"- failures: **{len(failures)}**\n")
          if failures:
              raise SystemExit("Some branch deletions failed; workflow file retained for investigation")
          PY

      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = os.environ["WORKFLOW_PATH"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AIMETON-one-time-old-branch-cleanup",
          }
          encoded = urllib.parse.quote(path, safe="/")
          req = urllib.request.Request(f"{api}/contents/{encoded}?ref=main", headers=headers)
          with urllib.request.urlopen(req, timeout=60) as resp:
              meta = json.loads(resp.read().decode("utf-8"))
          payload = json.dumps({
              "message": "Remove one-time old branch cleanup workflow",
              "sha": meta["sha"],
              "branch": "main",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"{api}/contents/{encoded}",
              data=payload,
              method="DELETE",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              response = json.loads(resp.read().decode("utf-8"))
          print(json.dumps({"self_removed": True, "commit": response["commit"]["sha"]}))
          PY
