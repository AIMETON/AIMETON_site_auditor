name: Configure DaData Stage

on:
  workflow_run:
    workflows:
      - Deploy Stage
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: aimeton-auditor-stage-dadata
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    environment: DADATA
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      STAGE_URL: https://stage-auditor.aimeton.ru
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
      DADATA_API: ${{ secrets.DADATA_API }}
      DADATA_SECRET: ${{ secrets.DADATA_SECRET }}
      DADATA_SMOKE_QUERY: ${{ vars.DADATA_SMOKE_QUERY || '7707083893' }}
      DADATA_PUBLIC_READY_ATTEMPTS: 8

    steps:
      - name: Require real successful deploy without marketplace actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          gate_sha="${EXPECTED_SHA:-$GITHUB_SHA}"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-dadata-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          if git cat-file -e "${gate_sha}^{commit}" 2>/dev/null; then
            echo "Reusing locally available exact commit $gate_sha"
            git checkout --detach --force "$gate_sha"
          else
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
            fetched=false
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --depth=1 origin "$gate_sha"; then fetched=true; break; fi
              test "$attempt" -lt 5
              sleep $(( attempt * attempt + 1 ))
            done
            test "$fetched" = true
            git checkout --detach --force FETCH_HEAD
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            trap - EXIT
          fi
          git reset --hard "$gate_sha"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$gate_sha"
          test -f scripts/require_successful_parent_job.py
          python3 scripts/require_successful_parent_job.py \
            --repository "$GITHUB_REPOSITORY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --parent-run-id "${PARENT_RUN_ID:-}" \
            --job-name deploy \
            --allow-manual

      - name: Resolve exact deployed source SHA
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test -f app-source-sha.txt
          deployed="$(cat app-source-sha.txt)"
          [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
          expected="${EXPECTED_SHA:-$deployed}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          [[ "$deployed" == "$expected" ]]
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          echo "DaData deployed source SHA: $expected"

      - name: Materialize exact DaData tooling with local reuse and bounded retry
        shell: bash
        env:
          TOOLING_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-dadata-tooling-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          if git cat-file -e "${TOOLING_SHA}^{commit}" 2>/dev/null; then
            echo "Reusing locally available exact commit $TOOLING_SHA"
            git checkout --detach --force "$TOOLING_SHA"
          else
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true' EXIT
            fetched=false
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --depth=1 origin "$TOOLING_SHA"; then fetched=true; break; fi
              test "$attempt" -lt 5
              sleep $(( attempt * attempt + 1 ))
            done
            test "$fetched" = true
            git checkout --detach --force FETCH_HEAD
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            trap - EXIT
          fi
          git reset --hard "$TOOLING_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TOOLING_SHA"
          test -f scripts/configure_dadata_stage.sh

      - name: Validate DaData secret contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DADATA_API DADATA_SECRET; do
            test -n "${!name:-}" || {
              echo "Missing required DADATA environment secret: $name" >&2
              exit 1
            }
            [[ "${!name}" != *$'\n'* ]] || {
              echo "Invalid newline in DADATA environment secret: $name" >&2
              exit 1
            }
          done
          echo "DaData environment secret contract present"

      - name: Validate committed stage smoke from exact tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          bash -n scripts/configure_dadata_stage.sh

      - name: Configure runtime and run live smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          install -d -m 0700 "$STACK_DIR/deployment-evidence"
          chmod +x scripts/configure_dadata_stage.sh
          scripts/configure_dadata_stage.sh 2>&1 | tee "$STACK_DIR/deployment-evidence/dadata-stage-${GITHUB_RUN_ID}.log"
          chmod 0600 "$STACK_DIR/deployment-evidence/dadata-stage-${GITHUB_RUN_ID}.log"

      - name: Dispatch Runtime Persistence Reconcile after successful DaData
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/persistence-dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/runtime-persistence-reconcile.yml/dispatches")"
          rm -f "$RUNNER_TEMP/persistence-dispatch-response.txt"
          test "$code" = 204
          echo "persistence_dispatch=ok"

      - name: Record redacted final state
        if: always()
        shell: bash
        run: |
          set +e
          cd "$STACK_DIR"
          mkdir -p deployment-evidence
          chmod 700 deployment-evidence
          evidence="deployment-evidence/dadata-final-state-${GITHUB_RUN_ID}.txt"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bundle_sha=$(cat app-source-sha.txt 2>/dev/null || echo unavailable)"
            echo "tooling_sha=${{ steps.source.outputs.sha }}"
            echo "marketplace_actions_on_stage_runner=disabled"
            docker ps --filter name=aimeton-auditor --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
            curl -sS "$STAGE_URL/api/missions/registry-mirror/dadata/health" || true
          } | tee "$evidence"
          chmod 600 "$evidence"
          find deployment-evidence -type f \( -name 'dadata-final-state-*.txt' -o -name 'dadata-stage-*.log' \) -mtime +30 -delete 2>/dev/null || true
          {
            echo '## DaData Stage evidence'
            echo
            echo '```text'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
