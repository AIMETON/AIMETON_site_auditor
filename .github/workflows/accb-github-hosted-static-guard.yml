name: ACCB GitHub-Hosted Static Guard
on:
  pull_request:
    paths:
      - ".github/workflows/accb-openrouter-edge-large-body-probe.yml"
      - ".github/workflows/accb-github-hosted-static-guard.yml"
      - "scripts/aimeton_command_router.py"
      - "tests/test_accb_openrouter_edge_probe_contract.py"
      - "tests/test_command_router_policy.py"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize PR head without Marketplace Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Run ACCB hosted-egress policy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check "pytest==8.4.2"
          python3 -m pytest -q \
            tests/test_accb_openrouter_edge_probe_contract.py \
            tests/test_command_router_policy.py
