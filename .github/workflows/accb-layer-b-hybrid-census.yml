name: ACCB Layer B Hybrid No-Paid Admission Census
on:
  workflow_dispatch:
    inputs:
      expected_sha: { required: true, type: string }
      evidence_issue: { required: true, default: "798", type: string }
      sol_transport_mode: { required: true, default: "direct", type: string }
permissions:
  contents: read
  issues: write
jobs:
  census:
    environment: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      OPENROUTER_PROXY_URL: ${{ vars.OPENROUTER_PROXY_URL }}
      SOL_TRANSPORT_MODE: ${{ inputs.sol_transport_mode }}
    steps:
      - name: Materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run fresh GET-only hybrid census
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/accb-layer-b-hybrid-census-$GITHUB_RUN_ID.json"
          set +e
          python3 scripts/accb_layer_b_hybrid_census.py             --openrouter-proxy-url "$OPENROUTER_PROXY_URL"             --sol-transport-mode "$SOL_TRANSPORT_MODE"             --output "$OUT"
          rc=$?
          set -e
          echo "ACCB_HYBRID_CENSUS_RC=$rc" >> "$GITHUB_ENV"
          echo "ACCB_HYBRID_CENSUS_RECEIPT=$OUT" >> "$GITHUB_ENV"

      - name: Publish sanitized hybrid admission receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path=pathlib.Path(os.environ.get("ACCB_HYBRID_CENSUS_RECEIPT",""))
          if path.is_file():
              p=json.loads(path.read_text(encoding="utf-8"))
              compact={
                  "status":p.get("status"),
                  "frozen_architecture_sha":p.get("frozen_architecture_sha"),
                  "execution_admission_sha":p.get("execution_admission_sha"),
                  "planned_cells":p.get("planned_cells"),
                  "routerai_models":[{
                      "model":x.get("model"),
                      "provider_name":x.get("provider_name"),
                      "tag":x.get("tag"),
                      "transport":x.get("transport"),
                      "context_length":x.get("context_length"),
                      "max_prompt_tokens":x.get("max_prompt_tokens"),
                      "max_completion_tokens":x.get("max_completion_tokens"),
                      "model_total_rub":(x.get("estimate") or {}).get("model_total_rub"),
                  } for x in p.get("routerai_models") or []],
                  "openrouter_sol":{
                      "model":(p.get("openrouter_sol") or {}).get("model"),
                      "provider_pin":(p.get("openrouter_sol") or {}).get("provider_pin"),
                      "transport":(p.get("openrouter_sol") or {}).get("transport"),
                      "eligible_openai_family_endpoints":(p.get("openrouter_sol") or {}).get("eligible_openai_family_endpoints"),
                      "model_total_usd_guard":((p.get("openrouter_sol") or {}).get("estimate") or {}).get("model_total_usd_guard"),
                      "model_total_rub_guard":((p.get("openrouter_sol") or {}).get("estimate") or {}).get("model_total_rub_guard"),
                      "usd_to_rub_budget_guard_rate":(p.get("openrouter_sol") or {}).get("usd_to_rub_budget_guard_rate"),
                  },
                  "routerai_four_model_total_rub":p.get("routerai_four_model_total_rub"),
                  "openrouter_sol_total_rub_guard":p.get("openrouter_sol_total_rub_guard"),
                  "whole_tranche_conservative_guard_rub":p.get("whole_tranche_conservative_guard_rub"),
                  "owner_first_stage_ceiling_rub":p.get("owner_first_stage_ceiling_rub"),
                  "budget_admitted":p.get("budget_admitted"),
                  "provider_generations_performed":p.get("provider_generations_performed"),
                  "paid_spend_authorized_by_this_census_rub":p.get("paid_spend_authorized_by_this_census_rub"),
                  "provider_api_secrets_used":p.get("provider_api_secrets_used"),
                  "tokenizer_preflight_required":p.get("tokenizer_preflight_required"),
                  "primary_input_length_measurement":p.get("primary_input_length_measurement"),
                  "pre_call_length_telemetry":p.get("pre_call_length_telemetry"),
                  "error_type":p.get("error_type"),
                  "safe_message":p.get("safe_message"),
              }
          else:
              compact={"status":"HYBRID_CENSUS_DID_NOT_EMIT_RECEIPT"}
          body="\n".join([
              "## ACCB Layer B fresh hybrid no-paid admission census",
              "",
              f"- exact Site Auditor SHA: `{os.environ['EXPECTED_SHA']}`",
              f"- runner: `{os.environ.get('RUNNER_NAME')}`",
              "- provider generations: `0`",
              "- provider API secrets used: `false`",
              "- this census authorizes spend: `0 RUB`",
              "",
              "```json",
              json.dumps(compact,ensure_ascii=False,indent=2,sort_keys=True),
              "```",
          ])
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body":body},ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept":"application/vnd.github+json",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              if response.status not in (200,201):
                  raise SystemExit(response.status)
          PY

      - name: Enforce fresh hybrid admission
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${ACCB_HYBRID_CENSUS_RC:-99}" = "0"
          python3 - "$ACCB_HYBRID_CENSUS_RECEIPT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["status"] == "ACCB_LAYER_B_HYBRID_CENSUS_COMPLETE"
          assert p["execution_admission_sha"] == "363f69971ed82ce3e4fc5ea9716652e57e83118e"
          assert p["tokenizer_preflight_required"] is False
          assert p["primary_cross_model_input_axis"] == "request_text_bytes"
          assert p["provider_input_tokens_role"].startswith("secondary model-specific")
          assert p["planned_cells"] == 15
          assert len(p["routerai_models"]) == 4
          assert p["provider_generations_performed"] == 0
          assert p["provider_api_secrets_used"] is False
          assert p["paid_spend_authorized_by_this_census_rub"] == 0
          assert p["budget_admitted"] is True
          assert p["whole_tranche_conservative_guard_rub"] <= 10000
          assert p["openrouter_sol"]["provider_pin"] == "openai"
          assert p["openrouter_sol"]["transport"] in {
              "openrouter-responses-via-direct",
              "openrouter-responses-via-http",
          }
          PY
