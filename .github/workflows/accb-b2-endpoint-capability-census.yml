name: ACCB B2 Endpoint Capability No-Paid Census

on:
  push:
    branches: [main]
    paths:
      - "scripts/accb_b2_endpoint_capability_census.py"
      - ".github/workflows/accb-b2-endpoint-capability-census.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      evidence_issue:
        required: true
        default: "798"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue || '798' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Read endpoint capability and pricing metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/accb-b2-capability-census.json"
          python3 scripts/accb_b2_endpoint_capability_census.py --output "$OUT"
          echo "B2_CENSUS=$OUT" >> "$GITHUB_ENV"

      - name: Enforce no-paid boundary and no legacy output cap
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$B2_CENSUS" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["status"] == "ACCB_B2_ENDPOINT_CAPABILITY_CENSUS_COMPLETE"
          assert p["http_methods"] == ["GET"]
          assert p["provider_api_secrets_used"] is False
          assert p["provider_generation_requests"] == 0
          assert p["paid_spend_authorized_rub"] == 0
          assert p["legacy_global_8192_output_cap_allowed"] is False
          routes=list(p["routerai_routes"])+[p["openrouter_sol"]]
          assert len(routes) == 5
          assert all(int(r["max_completion_tokens"]) > 8192 for r in routes)
          PY

      - name: Publish sanitized capability and cost evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          p=json.load(open(os.environ["B2_CENSUS"],encoding="utf-8"))
          routes=list(p["routerai_routes"])+[p["openrouter_sol"]]
          lines=[
            "## ACCB B2 zero-paid endpoint capability census",
            "",
            f"- exact Site Auditor SHA: `{os.environ['EXPECTED_SHA']}`",
            f"- status: **{p['status']}**",
            "- HTTP methods: `GET only`",
            "- provider API secrets used: `false`",
            "- provider generations: `0`",
            "- legacy global 8192 output cap allowed: `false`",
            f"- 25-cell conservative planning guard: `{p['whole_25_cell_cost_rub_guard']} RUB`",
            f"- planning input guard: `{p['planning_input_tokens_per_byte_guard']} token/byte` (budget only, not tokenizer evidence)",
            "",
            "| model | provider/tag | transport | context | max output admitted | model guard RUB |",
            "|---|---|---|---:|---:|---:|",
          ]
          for r in routes:
            provider=r.get("tag") or r.get("provider_name")
            lines.append(
              f"| {r['model']} | {provider} | {r['transport']} | {r['context_length']} | "
              f"{r['max_completion_tokens']} | {r['estimate']['model_total_rub_guard']} |"
            )
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
            data=json.dumps({"body":"\n".join(lines)}).encode(),
            method="POST",
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
            },
          )
          with urllib.request.urlopen(req,timeout=30) as response:
            assert response.status in (200,201)
          PY
