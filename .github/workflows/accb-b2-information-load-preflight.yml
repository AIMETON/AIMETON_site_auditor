name: ACCB B2 Information Load No-Paid Materialization

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      evidence_issue:
        required: true
        default: "798"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build five exact semantic information-load payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/accb-b2-materialization.json"
          python3 scripts/accb_b2_information_load_preflight.py --output "$OUT"
          echo "B2_REPORT=$OUT" >> "$GITHUB_ENV"

      - name: Enforce zero-spend and no-8192 boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$B2_REPORT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["provider_generation_requests"] == 0
          assert p["paid_spend_authorized_rub"] == 0
          assert p["provider_api_secrets_used"] is False
          assert p["network_calls_performed"] == 0
          assert p["legacy_global_8192_output_cap_allowed"] is False
          assert [x["request_text_bytes"] for x in p["tiers"]] == [32768,65536,143934,575367,2297725]
          PY

      - name: Publish sanitized materialization evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          p=json.load(open(os.environ["B2_REPORT"],encoding="utf-8"))
          lines=[
            "## ACCB B2 Information Load zero-paid materialization",
            "",
            f"- exact Site Auditor SHA: `{os.environ['EXPECTED_SHA']}`",
            f"- frozen Architecture SHA: `{p['frozen_architecture_sha']}`",
            f"- status: **{p['status']}**",
            f"- planned cells: `{p['planned_cells']}`",
            "- provider generations: `0`",
            "- provider API secrets used: `false`",
            "- network calls from materializer: `0`",
            "- legacy global 8192 output cap allowed: `false`",
            "",
            "| tier | bytes | entities | events | authoritative | rejected | semantic ratio | padding | payload SHA256 |",
            "|---|---:|---:|---:|---:|---:|---:|---:|---|",
          ]
          for r in p["tiers"]:
            lines.append(
              f"| {r['tier_id']} | {r['request_text_bytes']} | {r['tier_entity_count']} | "
              f"{r['event_count']} | {r['authoritative_transition_count']} | {r['rejected_record_count']} | "
              f"{r['semantic_evidence_ratio']} | {r['terminal_padding_bytes']} | `{r['payload_sha256']}` |"
            )
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
            data=json.dumps({"body":"\n".join(lines)}).encode(),
            method="POST",
            headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "Content-Type":"application/json",
            },
          )
          with urllib.request.urlopen(req,timeout=30) as response:
            assert response.status in (200,201)
          PY
