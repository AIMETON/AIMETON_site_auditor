name: Baseline CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VENV_DIR: /tmp/aimeton-baseline-${{ github.run_id }}

    steps:
      - name: Materialize exact commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cleanup_auth() {
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          }
          trap cleanup_auth EXIT
          fetched=false
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags --depth=1 origin "$TARGET_SHA"; then
              fetched=true
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * attempt + 1))
          done
          test "$fetched" = true
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          cleanup_auth
          trap - EXIT

      - name: Verify portable baseline contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/baseline-ci.yml').read_text(encoding='utf-8')
          marketplace_prefix = 'us' + 'es:'
          assert 'runs-on: ubuntu-24.04' in workflow
          assert 'x-access-token:${GH_TOKEN}' in workflow
          assert 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' in workflow
          assert 'aimeton-main-server' not in workflow
          assert '/mnt/aimeton-dependency-cache' not in workflow
          assert not any(line.lstrip().startswith(marketplace_prefix) for line in workflow.splitlines())
          PY

      - name: Create isolated local Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$VENV_DIR"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/pip" install -r requirements.txt

      - name: Record environment
        shell: bash
        run: |
          set -Eeuo pipefail
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" freeze | sort | tee baseline-dependencies.txt

      - name: Validate deployment script syntax
        shell: bash
        run: bash -n scripts/deploy_stage.sh

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          "$VENV_DIR/bin/pytest" -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Verify application import
        shell: bash
        run: "$VENV_DIR/bin/python -c \"from app.main import app; assert app.title == 'AIMETON Site Auditor'; print(app.version)\""

      - name: Local API and MCP route smoke
        shell: bash
        run: |
          "$VENV_DIR/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          paths = {
              path
              for route in app.routes
              if (path := getattr(route, "path", None)) is not None
          }
          assert "/api/health" in paths
          assert any(path == "/mcp" or path.startswith("/mcp") for path in paths)

          with TestClient(app) as client:
              response = client.get("/api/health")
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload["status"] == "ok"
              assert payload["version"] == app.version
              print(payload)
          PY

      - name: Record baseline diagnostics without artifact service
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '## Baseline CI evidence'
            echo
            echo "- runner: \`$RUNNER_NAME\`"
            echo "- machine: \`$(hostname)\`"
            echo "- exact SHA: \`$TARGET_SHA\`"
            echo '- GitHub Marketplace actions: `disabled`'
            echo "- runner image: \`${ImageOS:-github-hosted}\`"
            echo "- exact-SHA private fetch: \`x-access-token + credential cleanup\`"
            echo '- machine-specific runner proof: `separate dispatch-only workflow`'
            echo
            echo '### pytest tail'
            echo '```text'
            tail -n 80 pytest-output.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup isolated Python environment
        if: always()
        shell: bash
        run: rm -rf "$VENV_DIR"
