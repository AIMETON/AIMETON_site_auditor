name: ACCB Layer B DeepSeek Medium Single-Cell Recovery

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      evidence_issue:
        required: true
        default: "798"
        type: string
      owner_spend_authorized:
        required: true
        type: string
      max_budget_rub:
        required: true
        default: "200"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: accb-layer-b-deepseek-medium-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: stage
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      ACCB_EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      OWNER_SPEND_AUTHORIZED: ${{ inputs.owner_spend_authorized }}
      ACCB_RECOVERY_MAX_BUDGET_RUB: ${{ inputs.max_budget_rub }}
      FROZEN_ARCHITECTURE_SHA: b47b937873ef980601b5c741af9b327fb18365bc
      EXECUTION_ADMISSION_SHA: 363f69971ed82ce3e4fc5ea9716652e57e83118e
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}

    steps:
      - name: Require exact single-cell recovery boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$ACCB_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$OWNER_SPEND_AUTHORIZED" = "true"
          test "$ACCB_RECOVERY_MAX_BUDGET_RUB" = "200"
          test "$EXECUTION_ADMISSION_SHA" = "363f69971ed82ce3e4fc5ea9716652e57e83118e"
          test -n "$ROUTERAI_API_KEY"

      - name: Materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$ACCB_EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$ACCB_EXPECTED_SHA"

      - name: Bind frozen snapshot and verify single-cell payload without provider generation
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCH="$GITHUB_WORKSPACE/docs/research/accb_layer_b_snapshot/$FROZEN_ARCHITECTURE_SHA"
          test -f "$ARCH/ACCB-DEV-004.scenario.json"
          echo "ACCB_ARCHITECTURE_ROOT=$ARCH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          import accb_layer_b_live_execution as live
          p=live.materialize_common_payloads(Path("docs/research/accb_layer_b_snapshot/b47b937873ef980601b5c741af9b327fb18365bc"))[131072]
          assert p["request_text_bytes"] == 575367
          assert p["payload_sha256"] == "eb3bf2c81c12320ce992fd8aba0028e891673f7054d3bd2286ad58a486f811cc"
          assert 'SCENARIO_ID="ACCB-DEV-004"' in p["request_text"]
          PY

      - name: Execute exactly one DeepSeek medium recovery cell
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/accb-deepseek-medium-recovery-$GITHUB_RUN_ID.json"
          python3 scripts/accb_layer_b_deepseek_medium_recovery.py             --architecture-root "$ACCB_ARCHITECTURE_ROOT"             --output "$OUT"
          rc=$?
          echo "RECOVERY_RC=$rc" >> "$GITHUB_ENV"
          echo "RECOVERY_RECEIPT=$OUT" >> "$GITHUB_ENV"
          exit 0

      - name: Publish sanitized recovery evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path=pathlib.Path(os.environ.get("RECOVERY_RECEIPT",""))
          if path.is_file():
              p=json.loads(path.read_text(encoding="utf-8"))
              row=p.get("cell") or {}
              body="\n".join([
                  "## ACCB Layer B DeepSeek medium single-cell recovery",
                  "",
                  f"- exact Site Auditor SHA: `{p.get('site_auditor_sha')}`",
                  f"- source failed run: `{p.get('source_failed_run_id')}`",
                  f"- recovery status: **{p.get('status')}**",
                  f"- model: `{row.get('model')}`",
                  f"- payload bytes: `{row.get('request_text_bytes')}`",
                  f"- payload SHA256: `{row.get('payload_sha256')}`",
                  f"- provider tokens (diagnostic): `{row.get('L_model_input_provider')}`",
                  f"- cell status: **{row.get('status')}**",
                  f"- ACI / ACI_min: `{row.get('ACI')} / {row.get('ACI_min')}`",
                  f"- critical failures: `{len(row.get('critical_failures') or [])}`",
                  f"- guard/accounted RUB: `{p.get('fresh_single_cell_guard_rub')} / {row.get('accounted_cost_rub_guard')}`",
                  f"- error type: `{row.get('error_type')}`",
                  f"- error SHA256: `{row.get('error_message_sha256')}`",
                  "- provider generation attempts: `1`",
                  "- retries/fallbacks: `0 / false`",
              ])
          else:
              body="## ACCB Layer B DeepSeek medium single-cell recovery\n\n- status: **RECOVERY_DID_NOT_EMIT_RECEIPT**"
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body":body}).encode("utf-8"), method="POST",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"},
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              assert response.status in (200,201)
          PY

      - name: Enforce single-cell recovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RECOVERY_RECEIPT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          r=p["cell"]
          assert p["planned_recovery_cells"] == 1
          assert p["provider_generation_attempts_total"] == 1
          assert p["silent_retries"] == 0
          assert p["fallbacks"] is False
          assert p["max_recovery_budget_rub"] == 200.0
          assert r["model"] == "deepseek/deepseek-v4-pro-0813"
          assert r["request_text_bytes"] == 575367
          assert r["payload_sha256"] == "eb3bf2c81c12320ce992fd8aba0028e891673f7054d3bd2286ad58a486f811cc"
          assert r["provider_generation_attempts"] == 1
          assert p["status"] in {"RECOVERY_COMPLETE","RECOVERY_TERMINAL_INTEGRATION"}
          assert r["status"] == "RECOVERED_SINGLE_CELL" or r["status"].startswith("INTEGRATION_FAILURE") or r["status"] == "TRANSPORT_FAILURE"
          PY
          test "${RECOVERY_RC:-99}" = "0"
